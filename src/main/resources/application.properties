spring.application.name=incidentpilot
server.port=${SERVER_PORT:8080}

# Hindsight Long-Term Memory API Settings
hindsight.api.key=${HINDSIGHT_API_KEY:}
hindsight.base.url=${HINDSIGHT_BASE_URL:https://api.hindsight.ai}
hindsight.timeout.seconds=${HINDSIGHT_TIMEOUT_SECONDS:5}

# Official Hindsight Endpoint Paths (TODO: Set when official documentation provides them)
hindsight.endpoint.recall=${HINDSIGHT_ENDPOINT_RECALL:}
hindsight.endpoint.retain=${HINDSIGHT_ENDPOINT_RETAIN:}
hindsight.endpoint.reflect=${HINDSIGHT_ENDPOINT_REFLECT:}

# LLM Provider API Settings
llm.api.key=${LLM_API_KEY:}
llm.base.url=${LLM_BASE_URL:https://api.openai.com/v1}
llm.model=${LLM_MODEL:gpt-4o-mini}

# Logging configuration
logging.level.com.incidentpilot=INFO